<section class="agencies">
	<div class="agencies__filters">
		<input
			id="agencies-search"
			pInputText
			type="text"
			placeholder="Назва, місто або країна"
			class="agencies__search"
			[ngModel]="searchTerm()"
			(ngModelChange)="searchTerm.set($event)"
		/>
	</div>

	<div class="agencies__results">
		<div class="agencies__grid">
			@for (item of results(); track item._id) {
			<div class="agencies__row" (click)="view(item)">
				<app-agency-short [entity]="item" />
			</div>
			} @empty {
			<p class="agencies__empty">За заданим запитом агентств не знайдено.</p>
			}
		</div>
	</div>
</section>
