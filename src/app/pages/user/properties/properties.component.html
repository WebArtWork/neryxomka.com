<section class="properties">
	<div class="properties__filters">
		<input
			id="properties-search"
			pInputText
			type="text"
			[placeholder]="translateService.translate('Адреса, місто або країна')()"
			class="properties__search"
			[ngModel]="searchTerm()"
			(ngModelChange)="searchTerm.set($event)"
		/>

		<a pButton routerLink="/map" severity="secondary" size="small" class="properties__map-link" translate>
			Мапа
		</a>
	</div>

	<div class="properties__results">
		<div class="properties__grid">
			@for (item of results(); track item._id) {
			<div class="properties__row" (click)="view(item)">
				<app-property-short [entity]="item" />
			</div>
			} @empty {
			<p class="properties__empty" translate>За заданим запитом об’єктів не знайдено.</p>
			}
		</div>
	</div>
</section>
