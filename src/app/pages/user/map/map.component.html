<section class="map-page">
	<header class="map-page__header">
		<h2 class="map-page__title">Карта</h2>
		<span class="map-page__hint">Позначки об'єктів нерухомості з координатами з тестових даних</span>
	</header>

	<div class="map-page__layout">
		<div class="map-page__canvas">
			<app-leaflet-map
				[center]="center()"
				[zoom]="zoom"
				[markers]="markers()"
				(markerSelected)="onMarkerSelected($event)"
			/>

			@if (!markers().length) {
			<p class="map-page__empty">Немає об'єктів із координатами.</p>
			}
		</div>

		@if (selected(); as property) {
		<p-card class="map-page__panel">
			<div class="map-page__panel-header">
				<span class="map-page__panel-title">Обраний об'єкт</span>
				<p-button
					icon="pi pi-times"
					[text]="true"
					[rounded]="true"
					severity="secondary"
					(onClick)="closePanel()"
				/>
			</div>

			<app-property-short [entity]="property" />

			<p-button
				class="map-page__panel-action"
				label="Переглянути об'єкт"
				icon="pi pi-arrow-right"
				iconPos="right"
				(onClick)="view(property)"
			/>
		</p-card>
		}
	</div>
</section>
