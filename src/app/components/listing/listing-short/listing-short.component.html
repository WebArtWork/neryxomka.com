<article class="short">
	@if (entity.photos.length) {
		<img class="short__thumb" [src]="entity.photos[0]" [alt]="entity.title" loading="lazy" />
	}

	<div class="short__body">
		<h3 class="short__title">{{ entity.title }}</h3>
		<p class="short__address">{{ entity.publicLocation }}</p>

		<div class="short__meta">
			<span>{{ entity.price }} {{ entity.currency }}</span>
			<span>{{ entity.listingType }}</span>
			<span>{{ entity.status }}</span>
		</div>
	</div>
</article>
