<article class="short">
	@if (entity.photos.length) {
		<img class="short__thumb" [src]="entity.photos[0]" alt="" />
	}

	<div class="short__body">
		<h3 class="short__title">{{ entity.title }}</h3>
		<span class="short__meta">{{ entity.publicLocation }}</span>
		<span class="short__price">{{ entity.price }} {{ entity.currency }}</span>
	</div>
</article>
